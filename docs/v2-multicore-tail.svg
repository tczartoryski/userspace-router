<title id="title">Experimental workers: slower, worse tails</title><desc id="desc">4 workers oversubscribe the approved 2-vCPU guest; bars/whiskers retain all repeats. Bars are medians; whiskers are all retained repeat minima and maxima. Units: microseconds.</desc>
