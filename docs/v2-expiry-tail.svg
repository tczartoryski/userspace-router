<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Expiry optimization: socket RTT p99</title><desc id="desc">Orange after bars identify worse tails at 64 and 512 bytes; not one-way latency. Bars are medians; whiskers are all retained repeat minima and maxima. Units: microseconds.</desc>
<rect width="1200" height="360" fill="#101f26"/>
<g font-family="system-ui,sans-serif" fill="#edf8f5">
