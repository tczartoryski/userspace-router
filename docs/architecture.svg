<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc"><title id="title">Real IPv4 UDP userspace router and read-only telemetry</title><desc id="desc">Inside and outside Linux namespaces use kernel UDP endpoints and TUN devices. Only the Rust userspace router forwards packets and applies longest-prefix routes and endpoint-dependent NAT. Private atomic snapshots are read through fixed local VM management commands by a loopback-only dashboard on the host. Kernel forwarding and kernel NAT do not provide this path.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#bddda8"/></marker></defs><rect width="1040" height="480" fill="#10191c"/><rect x="20" y="20" width="1000" height="280" rx="12" fill="none" stroke="#607d80"/><rect x="20" y="330" width="1000" height="130" rx="12" fill="none" stroke="#607d80"/><g stroke="#bddda8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M275 145H360" marker-start="url(#arrow)"/><path d="M680 145H765" marker-start="url(#arrow)"/><path d="M520 225V255H820V368"/></g><g fill="#1b2b2e" stroke="#91c9bb"><rect x="45" y="90" width="230" height="135" rx="10"/><rect x="360" y="80" width="320" height="145" rx="10"/><rect x="765" y="90" width="230" height="135" rx="10"/><rect x="570" y="370" width="420" height="65" rx="10"/></g><g fill="#e2edeb" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle"><text x="520" y="52">Approved isolated Linux VM · no kernel forwarding / NAT dataplane</text><text x="160" y="125">Inside namespace</text><text x="160" y="159">Real kernel UDP clients</text><text x="160" y="193">TUN packet boundary</text><text x="520" y="117">Rust userspace dataplane</text><text x="520" y="151">IPv4 / UDP validation · LPM · TTL</text><text x="520" y="185">SNAT / reverse filter · bounded expiry</text><text x="880" y="125">Outside namespace</text><text x="880" y="159">Real kernel UDP server</text><text x="880" y="193">TUN packet boundary</text><text x="580" y="282">Private atomic JSON · actual routes, tuples and counters</text><text x="225" y="375">Host: fixed bounded VM read</text><text x="225" y="408">No shared mounts / public listener</text><text x="780" y="398">Read-only dashboard · 127.0.0.1 only</text><text x="780" y="423">Current / stale / offline · no invented metrics</text></g></svg>
